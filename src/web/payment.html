<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán — Studio Phim</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="mobile-shell">
    <div class="mobile-topbar">
      <a href="javascript:history.back()" class="icon-btn" aria-label="Quay lại">&larr;</a>
      <h1 class="display">Thanh toán</h1>
    </div>

    <div class="step-indicator" id="step-indicator">
      <div class="step done"><span class="dot">&#10003;</span><span class="label">Xác nhận</span></div>
      <div class="rule"></div>
      <div class="step active"><span class="dot">2</span><span class="label">Thanh toán</span></div>
    </div>

    <div class="mobile-content" id="payment-content">
      <div class="loading-state">Đang tải đơn đặt phòng...</div>
    </div>

    <div class="mobile-bottom-bar" id="bottom-bar" style="display:none;">
      <div class="inner">
        <div class="bar-price">
          <small>Cần thanh toán</small>
          <span id="bar-total">0đ</span>
        </div>
        <button type="button" class="btn btn-primary" id="pay-btn">Thanh toán</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
