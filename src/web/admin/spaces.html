<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản trị — Không gian</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a href="../index.html" class="brand display">Studio<span>Phim</span></a>
      <nav>
        <a href="index.html" data-admin-nav="dashboard">Tổng quan</a>
        <a href="spaces.html" data-admin-nav="spaces">Không gian</a>
        <a href="equipment.html" data-admin-nav="equipment">Thiết bị</a>
        <a href="reservations.html" data-admin-nav="reservations">Đặt phòng</a>
        <a href="billing.html" data-admin-nav="billing">Hoá đơn</a>
        <a href="courses.html" data-admin-nav="courses">Khoá học</a>
      </nav>
      <a href="../index.html" class="admin-back">&larr; Về trang khách hàng</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topline">
        <h1 class="display">Không gian (Spaces)</h1>
        <div><span class="nav-user" id="admin-user"></span> · <a href="#" id="admin-logout">Đăng xuất</a></div>
      </div>

      <div class="toolbar">
        <span class="results-count" id="results-count"></span>
        <button class="btn btn-primary" id="add-btn">+ Thêm không gian</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>ID</th><th>Ảnh</th><th>Tên</th><th>Loại</th><th>Giá/giờ</th><th>Sức chứa</th><th>Trạng thái</th><th>Hành động</th></tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="8">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="form-modal" style="display:none;">
    <div class="modal-box">
      <h2 id="form-title">Thêm không gian</h2>
      <form id="space-form">
        <input type="hidden" id="f-id" />
        <input type="hidden" id="f-provider" />
        <div class="field">
          <label>Tên không gian</label>
          <input type="text" id="f-name" required />
        </div>
        <div class="field">
          <label>Loại không gian</label>
          <select id="f-type" required>
            <option value="darkroom">Phòng tối (darkroom)</option>
            <option value="studio">Studio chụp</option>
          </select>
        </div>
        <div class="field">
          <label>Địa chỉ</label>
          <input type="text" id="f-address" />
        </div>
        <div class="field">
          <label>Mô tả</label>
          <textarea id="f-description" rows="3" style="width:100%;background:var(--base);border:1px solid var(--hairline);border-radius:var(--radius);color:var(--paper);padding:10px;"></textarea>
        </div>
        <div class="field">
          <label>Sức chứa tối đa</label>
          <input type="number" id="f-capacity" min="1" />
        </div>
        <div class="field">
          <label>Giá / giờ (VNĐ)</label>
          <input type="number" id="f-price" min="0" required />
        </div>
        <div class="field checkbox-row">
          <input type="checkbox" id="f-status" checked />
          <label for="f-status" style="margin:0;">Đang mở nhận đặt lịch</label>
        </div>
        <div class="field">
          <label>Ảnh không gian</label>
          <input type="file" id="f-images" accept="image/*" multiple />
          <small style="color:var(--muted);display:block;margin-top:4px;">Có thể chọn nhiều ảnh. Ảnh đầu tiên sẽ là ảnh đại diện.</small>
        </div>
        <div id="image-preview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
        <div class="inline-error" id="form-error" style="display:none;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="form-cancel">Huỷ</button>
          <button type="submit" class="btn btn-primary" id="form-submit">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="js/spaces-admin.js"></script>
</body>
</html>
