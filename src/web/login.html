<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Studio Phim</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-wrap {
      max-width: 380px;
      margin: 80px auto;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 32px;
    }
    .login-wrap h1 { font-size: 1.5rem; margin-bottom: 22px; }
    .login-msg {
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .login-msg.show { display: block; }
    .login-msg.err { color: var(--safelight); }
    .login-msg.ok { color: #7fbf8c; }
  </style>
</head>
<body data-nav="home">
  <header class="site-header">
    <a href="index.html" class="brand display">Studio<span>Phim</span></a>
    <nav>
      <a href="index.html" data-nav="home">Trang chủ</a>
      <a href="search.html" data-nav="search">Tìm phòng</a>
      <span id="nav-auth"></span>
    </nav>
  </header>
  <div class="sprocket-rule"></div>

  <main class="container">
    <div class="login-wrap">
      <h1 class="display">Đăng nhập</h1>
      <div id="login-msg" class="login-msg"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Tên đăng nhập / Email</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Đăng nhập</button>
      </form>
      <p style="margin-top:10px; font-size:0.85rem; color:var(--muted);">
        Chưa có tài khoản? <a href="register.html" style="color:var(--safelight);">Đăng ký</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
